[project]
name = "faq_agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.38.0",
    "oci==2.143.0",
    "oracledb==2.4.1",
    "pypdf==4.3.1",
    "python-dotenv==1.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
